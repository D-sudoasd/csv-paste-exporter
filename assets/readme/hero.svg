<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CSV Paste Exporter</title>
  <desc id="desc">Paste scientific table columns, preview, and export clean CSV, TXT, or TSV for Origin, Excel, Python, and MATLAB.</desc>
  <rect width="1200" height="360" rx="26" fill="#F3EFE6"/>
  <rect x="0" y="0" width="16" height="360" fill="#1F6B8A"/>
  <path d="M0 56H1200" stroke="#D9D2C4"/>
  <g transform="translate(56 44)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text fill="#6A655C" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2.2">WINDOWS · CLIPBOARD → CLEAN TABLE</text>
    <text y="92" fill="#14120F" font-size="52" font-weight="780" letter-spacing="-1.8">CSV Paste Exporter</text>
    <text y="140" fill="#3C3832" font-size="23">Paste columns. Preview. Export for Origin &amp; Excel.</text>
    <path d="M0 168H480" stroke="#C9C1B2"/>
    <g transform="translate(0 204)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
      <text fill="#14120F">COPY</text>
      <text x="78" fill="#6A655C">PASTE</text>
      <text x="158" fill="#6A655C">PREVIEW</text>
      <text x="256" fill="#6A655C">EXPORT</text>
      <text x="348" fill="#1F6B8A">UTF-8 / GBK</text>
    </g>
    <text y="266" fill="#7A7468" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">stdlib Python · single EXE · MIT</text>
  </g>
  <g transform="translate(700 52)">
    <rect width="440" height="256" fill="#14120F"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <text x="24" y="36" fill="#7A9088" font-size="12">CLIPBOARD → RECTANGULAR TABLE</text>
      <rect x="24" y="56" width="392" height="36" fill="#1E1C18"/>
      <text x="36" y="79" fill="#8FD0E8" font-size="13">strain</text>
      <text x="140" y="79" fill="#8FD0E8" font-size="13">stress_MPa</text>
      <text x="280" y="79" fill="#8FD0E8" font-size="13">time_s</text>
      <g fill="#EDE8DC" font-size="14">
        <text x="36" y="120">0.000</text><text x="140" y="120">12.4</text><text x="280" y="120">0.0</text>
        <text x="36" y="154">0.002</text><text x="140" y="154">48.1</text><text x="280" y="154">1.2</text>
        <text x="36" y="188">0.010</text><text x="140" y="188">210.6</text><text x="280" y="188">6.0</text>
        <text x="36" y="222">0.050</text><text x="140" y="222">512.0</text><text x="280" y="222">28.4</text>
      </g>
      <text x="24" y="248" fill="#6A655C" font-size="12">CSV · TXT · TSV · empty-row cleanup</text>
