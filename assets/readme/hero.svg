<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">CSV Paste Exporter</title>
  <desc id="desc">Paste scientific table columns, preview, and export clean CSV, TXT, or TSV for Origin, Excel, Python, and MATLAB.</desc>
  <rect width="1200" height="340" rx="28" fill="#0f172a"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="78" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing="2">WINDOWS · CLIPBOARD → TABLE</text>
    <text x="56" y="140" fill="#f8fafc" font-size="46" font-weight="800">CSV Paste Exporter</text>
    <text x="56" y="184" fill="#94a3b8" font-size="22">Paste columns. Preview. Export clean tables.</text>
    <text x="56" y="228" fill="#64748b" font-size="18">Origin · Excel · Python · MATLAB · instrument text</text>
  </g>
  <!-- pipeline chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
    <rect x="56" y="260" width="100" height="40" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="78" y="287" fill="#7dd3fc">Copy</text>
    <path d="M168 280 L188 280" stroke="#475569" stroke-width="3"/>
    <rect x="196" y="260" width="100" height="40" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="216" y="287" fill="#a7f3d0">Paste</text>
    <path d="M308 280 L328 280" stroke="#475569" stroke-width="3"/>
    <rect x="336" y="260" width="120" height="40" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="352" y="287" fill="#fbbf24">Preview</text>
    <path d="M468 280 L488 280" stroke="#475569" stroke-width="3"/>
    <rect x="496" y="260" width="110" height="40" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="514" y="287" fill="#f472b6">Export</text>
  </g>
  <!-- table proof -->
  <g transform="translate(700 56)">
    <rect width="440" height="240" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect width="440" height="44" rx="16" fill="#1e293b"/>
    <rect y="28" width="440" height="16" fill="#1e293b"/>
    <text x="20" y="30" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">strain</text>
    <text x="140" y="30" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">stress</text>
    <text x="260" y="30" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">time</text>
    <text x="360" y="30" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">…</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#e2e8f0">
      <text x="20" y="78">0.000</text><text x="140" y="78">12.4</text><text x="260" y="78">0.0</text>
      <text x="20" y="118">0.002</text><text x="140" y="118">48.1</text><text x="260" y="118">1.2</text>
      <text x="20" y="158">0.010</text><text x="140" y="158">210.6</text><text x="260" y="158">6.0</text>
      <text x="20" y="198">0.050</text><text x="140" y="198">512.0</text><text x="260" y="198">28.4</text>
    </g>
    <text x="20" y="228" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">CSV · TXT · TSV · UTF-8 / GBK</text>
  </g>
</svg>
